<title>Brume — dissipe la brume du monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0f131c; --panel:rgba(19,24,36,.95); --panel2:#1b2232; --line:rgba(255,255,255,.08);
  --text:#eef1f7; --muted:#8f98ac; --amber:#ffb547; --amber2:#ff8f3a; --teal:#4fe0b5;
  --common:#aab3c5; --rare:#9187ff; --legend:#ffcf4d; --danger:#ff6b6b;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --tabs:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#map{position:fixed;inset:0;background:#0f131c}
.leaflet-container{background:#0f131c;font-family:inherit}
.leaflet-bottom{bottom:calc(var(--tabs) + var(--sb))}
.leaflet-control-attribution{background:rgba(15,19,28,.7)!important;color:#7d869a!important;font-size:9px!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#9aa3b6!important}
.leaflet-div-icon{background:none;border:0}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;left:10px;right:10px;top:calc(var(--st) + 10px);z-index:1000;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lvl{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#1b1206;background:linear-gradient(145deg,var(--amber),var(--amber2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 4px 14px -4px rgba(255,160,60,.7)}
.xpwrap{flex:1;min-width:0}
.xpline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.xpline b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpline span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{position:relative;height:8px;margin-top:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:linear-gradient(90deg,var(--amber2),var(--amber));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.streak{flex:none;display:flex;align-items:center;gap:3px;padding:6px 9px;border-radius:12px;background:rgba(255,255,255,.05);font-size:15px}
.streak b{font-weight:700}
.streak.off{filter:grayscale(1);opacity:.55}
#xpPop{position:absolute;right:66px;bottom:-26px;padding:3px 8px;border-radius:9px;background:var(--panel);border:1px solid rgba(255,181,71,.35);font-size:12px;font-weight:700;color:var(--amber);opacity:0;transition:opacity .3s,transform .6s;pointer-events:none}
#xpPop.on{opacity:1;transform:translateY(-6px)}

.chips{position:fixed;left:10px;top:calc(var(--st) + 80px);z-index:990;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:calc(100% - 20px)}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;box-shadow:0 6px 20px -8px rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip .zn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.chip .pct{color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.chip.route{border-color:rgba(255,181,71,.4)}
.chip.route b{color:var(--amber)}
.chip .x{margin-left:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:12px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 128px);z-index:1200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.3;box-shadow:0 12px 30px -10px rgba(0,0,0,.7);animation:tin .35s cubic-bezier(.2,.9,.3,1.3);max-width:100%}
.toast.gold{border-color:rgba(255,207,77,.5)}
.toast.rare{border-color:rgba(145,135,255,.55)}
.toast.legend{border-color:var(--legend);box-shadow:0 0 30px -6px rgba(255,207,77,.6)}
.toast.err{border-color:rgba(255,107,107,.5)}
.toast.out{animation:tout .3s forwards}
.toast .ti{font-size:20px;flex:none}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* ---------- bottom controls ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:1100;height:calc(var(--tabs) + var(--sb));padding-bottom:var(--sb);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(13,17,26,.97);border-top:1px solid var(--line)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--amber)}
#tabs .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}

#explore{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + var(--sb) + 14px);z-index:1050;display:flex;flex-direction:column;align-items:center;gap:6px}
#exploreBtn{display:flex;align-items:center;gap:10px;padding:14px 24px;border-radius:999px;font-weight:700;font-size:16px;color:#1b1206;background:linear-gradient(145deg,var(--amber),var(--amber2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 10px 26px -8px rgba(255,150,50,.8);white-space:nowrap}
#exploreBtn .dot{width:10px;height:10px;border-radius:50%;background:#1b1206;opacity:.6}
#exploreBtn.on{color:var(--text);background:var(--panel);border:1px solid rgba(79,224,181,.45);box-shadow:0 10px 26px -10px rgba(0,0,0,.7)}
#exploreBtn.on .dot{background:var(--teal);opacity:1;box-shadow:0 0 0 0 rgba(79,224,181,.6);animation:pulse 1.6s infinite}
#gpsInfo{font-size:11px;color:var(--muted);padding:2px 8px;border-radius:8px;background:rgba(13,17,26,.75)}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(79,224,181,0)}100%{box-shadow:0 0 0 0 rgba(79,224,181,0)}}

.fab{position:fixed;right:12px;bottom:calc(var(--tabs) + var(--sb) + 18px);z-index:1040;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 22px -8px rgba(0,0,0,.7)}

<script>
(() => {
'use strict';

/* =========================================================
   Brume — carte à dissiper en marchant
   Données : OpenStreetMap (Overpass, Nominatim), itinéraires : OSRM (routing.openstreetmap.de)
   Tout est stocké dans le navigateur (localStorage).
   ========================================================= */

// ---------- réglages ----------
const DLAT = 0.000225, DLNG = 0.000275;   // taille d'une case ≈ 25 m
const CH = 32;                              // cases par "chunk" (accélère le dessin)
const UNLOCK_R = 35;                        // rayon débloqué autour de toi (m)
const MAX_ACC = 60;                         // précision GPS max acceptée (m)
const MAX_SPEED = 7;                        // au-delà (≈25 km/h) on considère que tu es en transport
const POI_TILE = 0.02;                      // tuiles de chargement des lieux (≈2 km)
const FOG = 'rgba(14,18,28,0.9)';
const KYOTO = [35.0037, 135.7788];
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
];

const CATS = {
  temple:     {label:'Temple',        plural:'Temples',         un:'un temple',          e:'🪷'},
  sanctuaire: {label:'Sanctuaire',    plural:'Sanctuaires',     un:'un sanctuaire',      e:'⛩️'},
  eglise:     {label:'Église',        plural:'Églises',         un:'une église',         e:'⛪'},
  culte:      {label:'Lieu de culte', plural:'Lieux de culte',  un:'un lieu de culte',   e:'🕊️'},
  vue:        {label:'Point de vue',  plural:'Points de vue',   un:'un point de vue',    e:'🌄'},
  musee:      {label:'Musée',         plural:'Musées',          un:'un musée',           e:'🏛️'},
  parc:       {label:'Parc & jardin', plural:'Parcs & jardins', un:'un parc ou jardin',  e:'🌳'},
  patrimoine: {label:'Patrimoine',    plural:'Patrimoine',      un:'un lieu historique', e:'📜'},
  attraction: {label:'Attraction',    plural:'Attractions',     un:'une attraction',     e:'✨'}
};
const RAR = {
  common: {label:'Commun',     xp:20},
  rare:   {label:'Rare',       xp:50},
  legend: {label:'Légendaire', xp:150}
};
const TITLES = [[1,'Promeneur'],[3,'Flâneur'],[5,'Curieux'],[8,'Explorateur'],[12,'Aventurier'],[16,'Cartographe'],[21,'Pionnier'],[28,'Légende vivante']];
const ZLEVELS = [
  {k:'quartier',       zoom:14, label:'Quartier',       mult:1},
  {k:'arrondissement', zoom:12, label:'Arrondissement', mult:2},
  {k:'ville',          zoom:10, label:'Ville',          mult:4}
];
const MILESTONES = [[25,60],[50,150],[75,400]];

// ---------- utilitaires ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAD = Math.PI / 180;
function hav(a, b, c, d) {
  const dLat = (c - a) * RAD, dLng = (d - b) * RAD;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * RAD) * Math.cos(c * RAD) * Math.sin(dLng / 2) ** 2;
  return 12742000 * Math.asin(Math.min(1, Math.sqrt(x)));
}
const fmtDist = m => m < 1000 ? (Math.max(10, Math.round(m / 10) * 10)) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ',') + ' km';
const fmtNum = n => Math.round(n).toLocaleString('fr-FR');
const mod = (a, n) => ((a % n) + n) % n;
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const mercY = lat => { const r = Math.max(-85.0511, Math.min(85.0511, lat)) * RAD; return 0.5 - Math.log(Math.tan(Math.PI / 4 + r / 2)) / (2 * Math.PI); };
const cellArea = lat => (DLAT * 111320) * (DLNG * 111320 * Math.cos(lat * RAD));
function fetchT(url, opt = {}, ms = 25000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, {...opt, signal: ctl.signal}).finally(() => clearTimeout(t));
}

// ---------- stockage ----------
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const parse = (s, d) => { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } };
const defaultState = () => ({
  v: 1, xp: 0, discovered: {}, daily: null, streak: {count: 0, best: 0, last: null},
  badges: {}, flags: {}, stats: {dist: 0, since: Date.now()}, lastPos: null,
  autoStart: false, demo: false, onboarded: false
});
let S = Object.assign(defaultState(), parse(LS.get('brume.state'), {}));
const P = Object.assign({tiles: {}, items: {}}, parse(LS.get('brume.pois'), {}));
const Z = Object.assign({list: [], miss: []}, parse(LS.get('brume.zones'), {}));
P.fail = {};

// cases débloquées
const cells = new Set();
const chunks = new Map();
const ck = (i, j) => i + ',' + j;

    if (t === 'cells') { const n = [40, 70, 110][p]; return {t, n, xp: n + 20, done: false}; }
    if (t === 'pois') { const n = [1, 2, 3][p]; return {t, n, xp: 40 * n, done: false}; }
    if (t === 'dist') { const n = [1.5, 3, 5][p]; return {t, n, xp: Math.round(n * 30), done: false}; }

}

function inRing(x, y, ring) {

  }

}

    if (!hole) return true;

}

// ---------- lieux (OpenStreetMap / Overpass) ----------
function categorize(t) {

    if (t.religion === 'buddhist') return 'temple';
    if (t.religion === 'shinto') return 'sanctuaire';
    if (t.religion === 'christian') return 'eglise';
    return 'culte';
  }
  if (t.tourism === 'viewpoint') return 'vue';
  if (t.tourism === 'museum' || t.tourism === 'gallery') return 'musee';
  if (t.leisure === 'park' || t.leisure === 'garden') return 'parc';
  if (t.historic) return 'patrimoine';
  if (t.tourism === 'attraction') return 'attraction';
  return null;
}
function parseEl(el) {
  const t = el.tags || {};
  if (!t.name || t.access === 'private' || t.access === 'no') return null;
  const lat = el.lat ?? el.center?.lat, lng = el.lon ?? el.center?.lon;
  if (lat == null || lng == null) return null;
  const cat = categorize(t); if (!cat) return null;
  const local = t['name:fr'] || t['name:en'];

}

      if (!r.ok) throw new Error('overpass ' + r.status);

}
let ovMirror = 0;
async function loadTile(tk) {
  const [ty, tx] = tk.split(',').map(Number);
  const s = (ty * POI_TILE).toFixed(4), w = (tx * POI_TILE).toFixed(4), n = ((ty + 1) * POI_TILE).toFixed(4), e = ((tx + 1) * POI_TILE).toFixed(4);
  const bb = `${s},${w},${n},${e}`;
  const q = `[out:json][timeout:30];(
nwr["amenity"="place_of_worship"]["name"](${bb});
nwr["tourism"~"^(viewpoint|museum|gallery|attraction)$"]["name"](${bb});
nwr["historic"~"^(castle|monument|memorial|ruins|archaeological_site|city_gate|tomb|fort|manor|palace|building|church|temple|shrine|monastery)$"]["name"](${bb});
nwr["leisure"~"^(park|garden)$"]["name"](${bb});

  const json = await overpass(q);

}

function processPos(lat, lng, acc, ts) {

// ---------- découvertes ----------

    if (Math.abs(p.lat - me.lat) > 0.0015 || Math.abs(p.lng - me.lng) > 0.002) continue;
    if (hav(p.lat, p.lng, me.lat, me.lng) <= (p.big ? 90 : 45) + acc) discover(p);
  }
  const d = getDaily();
  if (d.mystery && !d.mysteryDone && !P.items[d.mystery.id] && hav(d.mystery.lat, d.mystery.lng, me.lat, me.lng) <= 45 + acc) discover(d.mystery);

  }

  try { if ('wakeLock' in navigator && !wake && exploring && !document.hidden) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
document.addEventListener('click', () => { if (exploring && !wake) requestWake(); }, true);

function onGeo(pos) {
  const c = pos.coords;
  processPos(c.latitude, c.longitude, c.accuracy || 30, pos.timestamp || Date.now());
}
function onGeoErr(err) {
  if (err.code === 1) {
    stopExplore();
    toast('🚫', 'Localisation refusée. Autorise-la pour ce site dans les réglages du navigateur.', 'err', 6000);
  } else updateGps('Recherche du signal GPS…');
}
function startExplore() {
  if (S.demo) {
    exploring = true; S.autoStart = true;
    if (!me) { const c = map.getCenter(); processPos(c.lat, c.lng, 5, Date.now()); }
    toast('🕹️', 'Mode démo : touche la carte pour te déplacer.', '', 4000);
    renderExplore(); return;
  }
  if (!('geolocation' in navigator)) { toast('🚫', 'Ce navigateur ne donne pas accès à la position.', 'err'); return; }
  if (!window.isSecureContext) toast('🔒', 'Le GPS ne marche qu’en https:// (ex. GitHub Pages).', 'err', 6000);
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onGeo, onGeoErr, {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
  exploring = true; follow = true; S.autoStart = true;
  requestWake(); renderExplore(); updateGps('Recherche du signal GPS…'); scheduleSave();
}
function stopExplore() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; exploring = false; S.autoStart = false; lastGood = null;
  stopSim(); releaseWake(); renderExplore(); saveNow();
}
function renderExplore() {
  const b = $('#exploreBtn');
  b.classList.toggle('on', exploring);
  $('#exploreLabel').textContent = exploring ? (S.demo ? 'Démo en cours' : 'Exploration en cours') : 'Explorer';
  $('#gpsInfo').classList.toggle('hidden', !exploring);
  updateGps();
}
function updateGps(msg) {
  const g = $('#gpsInfo');
  if (!exploring) return;
  if (S.demo) { g.textContent = 'Touche la carte pour marcher'; return; }
  if (msg) { g.textContent = msg; return; }
  if (me) g.textContent = me.acc > MAX_ACC ? `Signal faible (±${Math.round(me.acc)} m)` : `GPS ±${Math.round(me.acc)} m${wake ? ' · écran maintenu allumé' : ''}`;
}
$('#exploreBtn').addEventListener('click', () => exploring ? stopExplore() : startExplore());
$('#locBtn').addEventListener('click', () => {
  follow = true;
  if (me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 16));
  else if (!exploring) startExplore();
});
map.on('dragstart', () => { follow = false; });

// ---------- mode démo (marcher en touchant la carte) ----------
let sim = null;
function stopSim() { if (sim) { clearInterval(sim.timer); sim = null; } }
map.on('click', e => {
  if (S.demo && exploring) {
    const from = me ? [me.lat, me.lng] : [e.latlng.lat, e.latlng.lng];
    stopSim();
    sim = {lat: from[0], lng: from[1], to: e.latlng, timer: setInterval(() => {
      const d = hav(sim.lat, sim.lng, sim.to.lat, sim.to.lng), step = 20 * 0.2; // 20 m/s : plus rapide qu'à pied pour tester
      if (d <= step) { processPos(sim.to.lat, sim.to.lng, 5, Date.now()); return stopSim(); }
      const f = step / d; sim.lat += (sim.to.lat - sim.lat) * f; sim.lng += (sim.to.lng - sim.lng) * f;
      processPos(sim.lat, sim.lng, 5, Date.now());
    }, 200)};
    follow = true;
    return;
  }
  if (selected) closeCard();
});

// ---------- panneaux ----------
let tab = 'carte';
function setTab(t) {
  if (t === tab && t !== 'carte') t = 'carte';
  tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'carte') { closeSheet(); return; }
  closeCard();
  renderSheet();
  $('#sheet').classList.remove('hidden');
  $('#explore').classList.add('hidden'); $('#locBtn').classList.add('hidden');
}
function closeSheet() {
  $('#sheet').classList.add('hidden');
  tab = 'carte'; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'carte'));
  if (!selected) { $('#explore').classList.remove('hidden'); $('#locBtn').classList.remove('hidden'); }
}
function renderSheet() {
  const T = {defis: 'Défis du jour', collection: 'Collection', profil: 'Profil'};
  $('#sheetTitle').textContent = T[tab] || '';
  $('#sheetBody').innerHTML = tab === 'defis' ? viewDefis() : tab === 'collection' ? viewCollection() : viewProfil();
}
function viewDefis() {
  const d = getDaily(); const st = streakNow();
  let h = `<div class="card"><div class="row"><div class="emo">🔥</div><div class="grow">
      <div class="ttl">${st ? `Série de ${st} jour${st > 1 ? 's' : ''}` : 'Pas de série en cours'}</div>
      <div class="sub">${S.streak.last === d.date ? 'Journée validée ✓' : 'Débloque 10 cases aujourd’hui pour la prolonger'} · record : ${S.streak.best || 0}</div>
    </div></div></div>`;
  h += `<div class="sec"><h3>Mystère du jour</h3>`;
  if (d.mystery) {
    const p = d.mystery, dist = me ? fmtDist(hav(me.lat, me.lng, p.lat, p.lng)) : null;
    h += `<div class="card mys ${d.mysteryDone ? 'done' : ''}"><div class="row"><div class="emo">${d.mysteryDone ? (CATS[p.cat]?.e || '✓') : '?'}</div><div class="grow">
        <div class="ttl">${d.mysteryDone ? esc(p.name) : `Un lieu ${p.r === 'common' ? 'mystère' : `<span class="rar r-${p.r}">${RAR[p.r].label.toLowerCase()}</span>`} se cache${dist ? ' à ' + dist : ''}`}</div>
        <div class="sub">${d.mysteryDone ? 'Résolu ✓' : 'Rejoins-le pour le révéler'}</div></div><span class="xp">+150 XP</span></div>
        ${d.mysteryDone ? '' : `<div class="pc-btns"><button class="btn primary" data-act="route" data-id="${esc(p.id)}">🚶 Y aller</button><button class="btn" data-act="goto" data-id="${esc(p.id)}">Voir sur la carte</button></div>`}
      </div>`;
  } else h += `<div class="empty">Lance l’exploration : un lieu mystère apparaîtra à moins de 2,5 km de toi.</div>`;
  h += `</div><div class="sec"><h3>Défis</h3>`;
  for (const c of d.ch) {
    const pr = Math.min(1, chProg(c, d) / c.n);
    const cur = c.t === 'dist' ? (d.dist / 1000).toFixed(1).replace('.', ',') + ' / ' + String(c.n).replace('.', ',') + ' km' : Math.min(chProg(c, d), c.n) + ' / ' + c.n;
    const e = c.t === 'cells' ? '🌫️' : c.t === 'pois' ? '🔎' : c.t === 'dist' ? '🥾' : (CATS[c.cat]?.e || '✨');
    h += `<div class="card ${c.done ? 'done' : ''}"><div class="row"><div class="emo">${c.done ? '✅' : e}</div><div class="grow">
      <div class="ttl">${esc(chLabel(c))}</div><div class="sub">${c.done ? 'Réussi' : cur}</div></div><span class="xp">+${c.xp} XP</span></div>
      <div class="bar am"><i style="width:${pr * 100}%"></i></div></div>`;
  }
  h += `<p class="note">Bonus de 100 XP si tu réussis les trois. De nouveaux défis chaque jour à minuit.</p></div>`;
  return h;
}
function viewCollection() {
  const found = Object.values(S.discovered);
  const known = {}; for (const p of Object.values(P.items)) known[p.cat] = (known[p.cat] || 0) + 1;
  const byCat = {}; for (const p of found) byCat[p.cat] = (byCat[p.cat] || 0) + 1;
  const rc = {common: 0, rare: 0, legend: 0}; found.forEach(p => rc[p.r]++);
  let h = `<div class="stats"><div class="stat"><b>${found.length}</b><span>lieux découverts</span></div>
    <div class="stat"><b><span class="rar r-rare">${rc.rare}</span> · <span class="rar r-legend">${rc.legend}</span></b><span>rares · légendaires</span></div></div>`;
  h += `<div class="sec"><h3>Catégories</h3><div class="cats">`;
  for (const [k, c] of Object.entries(CATS)) {
    if (!byCat[k] && !known[k]) continue;
    h += `<div class="cat ${byCat[k] ? '' : 'zero'}"><div class="e">${c.e}</div><div class="c">${byCat[k] || 0}<span style="color:var(--muted);font-weight:500;font-size:12px"> / ${Math.max(known[k] || 0, byCat[k] || 0)}</span></div><div class="l">${c.plural}</div></div>`;
  }
  h += `</div><p class="note">Le second chiffre compte les lieux repérés autour des zones que tu as explorées.</p></div>`;
  h += `<div class="sec"><h3>Derniers lieux découverts</h3>`;
  if (!found.length) h += `<div class="empty">Ta collection est vide. Les « ? » sur la carte sont des lieux à découvrir : touche-en un pour l’itinéraire.</div>`;
  else {
    h += `<div class="card list" style="padding:4px 12px">`;
    for (const p of found.sort((a, b) => b.t - a.t).slice(0, 80)) {
      h += `<button class="it" data-act="goto" data-id="${esc(p.id)}"><div class="emo">${CATS[p.cat]?.e || '•'}</div><div class="grow">
        <div class="ttl">${esc(p.name)}</div><div class="sub">${CATS[p.cat]?.label || ''} · <span class="rar r-${p.r}">${RAR[p.r].label}</span> · ${new Date(p.t).toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'})}</div></div></button>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}
function viewProfil() {
  const l = levelOf(S.xp), a = xpFor(l), b = xpFor(l + 1);
  const area = cells.size * cellArea(S.lastPos ? S.lastPos[0] : 35) / 1e6;
  let h = `<div class="card"><div class="row"><div class="lvl" style="width:54px;height:54px;font-size:24px">${l}</div><div class="grow">
      <div class="ttl" style="font-size:18px">${esc(titleOf(l))}</div><div class="sub">${fmtNum(S.xp)} XP au total · niveau ${l + 1} dans ${fmtNum(b - S.xp)} XP</div>
      <div class="bar am"><i style="width:${(S.xp - a) / (b - a) * 100}%"></i></div></div></div></div>`;
  h += `<div class="sec"><div class="stats">
      <div class="stat"><b>${fmtNum(cells.size)}</b><span>cases débloquées</span></div>
      <div class="stat"><b>${area.toFixed(area < 10 ? 2 : 1).replace('.', ',')}</b><span>km² explorés</span></div>
      <div class="stat"><b>${(S.stats.dist / 1000).toFixed(1).replace('.', ',')}</b><span>km parcourus</span></div>
      <div class="stat"><b>${nFound()}</b><span>lieux découverts</span></div></div></div>`;
  h += `<div class="sec"><h3>Zones explorées</h3>`;
  const zs = Z.list.filter(z => z.count > 0).sort((x, y) => zonePct(y) - zonePct(x));
  if (!zs.length) h += `<div class="empty">Tes quartiers, arrondissements et villes apparaîtront ici dès que tu commenceras à marcher.</div>`;
  for (const z of zs.slice(0, 30)) {
    const pct = zonePct(z), lv = ZLEVELS.find(x => x.k === z.k);
    const next = MILESTONES.find(([m]) => pct < m);
    h += `<button class="card" style="display:block;width:100%;text-align:left" data-act="zone" data-id="${esc(z.id)}"><div class="row"><div class="grow">
      <div class="ttl"><span class="tag">${lv ? lv.label : ''}</span>${esc(z.name)}</div>
      <div class="sub">${pct.toFixed(pct < 10 ? 1 : 0).replace('.', ',')} % ${next ? `· prochain palier ${next[0]} %` : '· complété 🏅'}</div></div></div>
      <div class="bar"><i style="width:${Math.max(1.5, pct / 75 * 100)}%"></i></div></button>`;
  }
  h += `<p class="note">75 % = zone complétée : une partie de chaque quartier (bâtiments, rivières, terrains privés) n’est pas accessible à pied.</p></div>`;
  h += `<div class="sec"><h3>Succès · ${Object.keys(S.badges).length} / ${BADGES.length}</h3><div class="badges">`;
  for (const bd of BADGES) {
    const got = !!S.badges[bd.id];
    if (!got && bd.hidden) h += `<div class="bdg lock"><div class="e">❔</div><div class="n">Succès caché</div><div class="d">À toi de le trouver</div></div>`;
    else h += `<div class="bdg ${got ? 'got' : 'lock'}"><div class="e">${bd.e}</div><div class="n">${esc(bd.n)}</div><div class="d">${esc(bd.d)}</div></div>`;
  }
  h += `</div></div>`;
  h += `<div class="sec"><h3>Réglages</h3>
    <div class="card"><div class="row"><div class="grow"><div class="ttl">Mode démo</div><div class="sub">Touche la carte pour te déplacer sans GPS. Les progrès comptent : à utiliser pour tester.</div></div>
      <button class="switch ${S.demo ? 'on' : ''}" data-act="demo" aria-label="Mode démo"></button></div></div>
    <div class="card"><div class="ttl">Sauvegarde</div><div class="sub">Tout est enregistré dans ce navigateur. Exporte de temps en temps pour ne rien perdre.</div>
      <div class="pc-btns"><button class="btn sm" data-act="export">Exporter</button><button class="btn sm" data-act="import">Importer</button><button class="btn sm danger" data-act="reset">Tout effacer</button></div>
      <div id="ioBox"></div></div>
    <p class="note">Carte © OpenStreetMap et CARTO · lieux : OpenStreetMap (Overpass) · quartiers : Nominatim · itinéraires : OSRM.</p></div>`;
  return h;
}

// ---------- export / import ----------
function exportData() {
  saveNow();
  const data = JSON.stringify({app: 'brume', v: 1, at: new Date().toISOString(), state: S, cells: Array.from(cells).join(';')});
  const box = $('#ioBox');
  box.innerHTML = `<textarea readonly id="ioTxt"></textarea><div class="pc-btns"><button class="btn sm" data-act="copy">Copier</button><a class="btn sm" id="dl" download="brume-sauvegarde.json">Télécharger</a></div>`;
  $('#ioTxt').value = data;
  try { $('#dl').href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); } catch (e) {}
}
function importBox() {
  $('#ioBox').innerHTML = `<textarea id="ioTxt" placeholder="Colle ici le contenu de ta sauvegarde…"></textarea>
    <div class="pc-btns"><label class="btn sm">Choisir un fichier<input type="file" id="ioFile" accept=".json,application/json" hidden></label><button class="btn sm primary" data-act="do-import">Importer</button></div>`;
  $('#ioFile').addEventListener('change', async e => { const f = e.target.files[0]; if (f) $('#ioTxt').value = await f.text(); });
}
function doImport() {
  const j = parse($('#ioTxt').value, null);
  if (!j || j.app !== 'brume' || !j.state) { toast('⚠️', 'Sauvegarde illisible.', 'err'); return; }
  LS.set('brume.state', JSON.stringify(j.state)); LS.set('brume.cells', j.cells || '');
  LS.del('brume.zones');
  location.reload();
}

// ---------- actions ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'tab') setTab(el.dataset.tab);
  else if (a === 'close-sheet') closeSheet();
  else if (a === 'close-card') closeCard();
  else if (a === 'route') { const p = getPoi(id); closeSheet(); if (p) routeTo(p); }
  else if (a === 'clear-route') clearRoute();
  else if (a === 'show-card') showCard(id, false);
  else if (a === 'goto') { const p = getPoi(id); if (p) { closeSheet(); follow = false; map.setView([p.lat, p.lng], Math.max(map.getZoom(), 16)); setTimeout(() => { refreshMarkers(true); openPoi(p); }, 350); } }
  else if (a === 'zone') { const z = Z.list.find(x => x.id === id); if (z) { closeSheet(); follow = false; map.fitBounds([[z.bbox[1], z.bbox[0]], [z.bbox[3], z.bbox[2]]], {padding: [30, 30]}); } }
  else if (a === 'demo') {
    const wasExploring = exploring; if (exploring) stopExplore();
    S.demo = !S.demo; lastGood = null; saveNow(); renderSheet();
    toast('🕹️', S.demo ? 'Mode démo activé. Appuie sur Explorer puis touche la carte.' : 'Mode démo désactivé.', '');
    if (wasExploring) startExplore();
  }
  else if (a === 'export') exportData();
  else if (a === 'import') importBox();
  else if (a === 'do-import') doImport();
  else if (a === 'copy') { try { navigator.clipboard.writeText($('#ioTxt').value).then(() => toast('📋', 'Sauvegarde copiée.', '')); } catch (err) { $('#ioTxt').select(); } }
  else if (a === 'reset') modal(`<div class="bige">⚠️</div><h2>Tout effacer ?</h2><p>Ta carte, ton XP, ta collection et tes succès seront supprimés de ce navigateur. C’est définitif.</p>
      <div class="btns"><button class="btn danger" data-act="reset-yes">Oui, tout effacer</button><button class="btn" data-act="modal-close">Annuler</button></div>`);
  else if (a === 'reset-yes') { ['brume.state', 'brume.cells', 'brume.zones'].forEach(LS.del); saveNow = () => {}; location.reload(); }
  else if (a === 'modal-close') closeModal();
  else if (a === 'start') { closeModal(); S.onboarded = true; S.demo = false; startExplore(); }
  else if (a === 'start-demo') { closeModal(); S.onboarded = true; S.demo = true; saveNow(); startExplore(); }
});

// ---------- démarrage ----------
renderHud(); renderExplore(); updateZoneChip(); refreshMarkers(true);
if (!S.onboarded) {
  modal(`<div class="logo"></div><h2>Brume</h2><p>Le monde est couvert de brume. Marche pour la dissiper, découvre les lieux cachés et monte en niveau.</p>
    <ul class="tips">
      <li><span>🚶</span>Garde l’app ouverte quand tu marches : l’écran reste allumé et la brume recule autour de toi.</li>
      <li><span>❓</span>Les « ? » sont des lieux à découvrir. Touche-les pour avoir l’itinéraire à pied.</li>
      <li><span>🎯</span>Chaque jour : trois défis et un mystère à résoudre.</li>
    </ul>
    <div class="btns"><button class="btn primary" data-act="start">Commencer l’exploration</button><button class="btn" data-act="start-demo">Essayer en mode démo</button></div>`);
} else if (S.autoStart) startExplore();
if (S.lastPos) { ensurePoisAround(S.lastPos[0], S.lastPos[1]); }
setInterval(() => { renderHud(); }, 60000);

// accès pour les tests
window.__brume = {S, P, Z, cells, processPos, map};
})();
</script>
</body>
